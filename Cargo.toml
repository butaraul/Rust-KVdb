[workspace]
resolver = "2"
members = [
    "crates/storage",
    "crates/persistence",
    "crates/protocol",
    "crates/server",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = true
